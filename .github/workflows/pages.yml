name: Check and deploy academic homepage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Checks never need Pages write permission or access to repository secrets.
permissions:
  contents: read

concurrency:
  group: academic-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Validate and preview-build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby and locked gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.13'
          bundler-cache: true
      - name: Check generated BibTeX is synchronized with publication data
        run: bundle exec ruby scripts/generate_bibtex.rb --check
      - name: Validate content
        run: bundle exec ruby scripts/validate_content.rb --mode preview
      - name: Exercise empty and long publication fixtures
        run: bundle exec ruby scripts/test_site.rb
      - name: Build local-preview variant
        run: bundle exec jekyll build --config _config.yml,_config.preview.yml --trace
      - name: Check generated files and internal links
        run: bundle exec ruby scripts/check_site.rb _site

  pages-build:
    name: Prepare approved production artifact
    needs: check
    # An unset variable, a PR, or a manual run on another branch cannot deploy.
    if: >-
      vars.PAGES_DEPLOY_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby and locked gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.13'
          bundler-cache: true
      - name: Enforce publication readiness and real content
        run: bundle exec ruby scripts/validate_content.rb --mode production
      # This metadata request is intentionally absent from PR/check-only runs.
      # It does not enable Pages or change the account/repository settings.
      - name: Read configured Pages metadata
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Require the confirmed site address to match GitHub Pages
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          bundle exec ruby -ryaml -e '
            config = YAML.safe_load_file("_config.yml", permitted_classes: [], aliases: false)
            abort "Configured url differs from Pages origin" unless config["url"].to_s.delete_suffix("/") == ENV.fetch("PAGES_ORIGIN").delete_suffix("/")
            abort "Configured baseurl differs from Pages path" unless config["baseurl"].to_s == ENV.fetch("PAGES_BASE_PATH")
          '
      - name: Build production site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --config _config.yml --trace
      - name: Check production output
        run: bundle exec ruby scripts/check_site.rb _site
      - name: Upload only the generated website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
          retention-days: 1

  deploy:
    name: Deploy approved artifact to GitHub Pages
    needs: pages-build
    if: >-
      vars.PAGES_DEPLOY_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy generated Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
